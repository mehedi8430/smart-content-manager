name: smart-content-manager-e2e

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_content_manager_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_content_manager_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data
    logging: *default-logging

  server:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3001
      CORS_ORIGIN: http://localhost:3002
      ACCESS_TOKEN_SECRET: e2e-access-secret
      REFRESH_TOKEN_SECRET: e2e-refresh-secret
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 1d
      BCRYPT_SALT_ROUNDS: 12
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      AI_RATE_LIMIT_MAX: "5"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smart_content_manager_e2e?schema=public&sslmode=disable
      ANTHROPIC_API_KEY: ""
      AI_MOCK_MODE: "true"
    ports:
      - "3003:3001"
    command: >
      sh -c "cd /app/apps/api && bun run start:e2e"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://server:3001/api/v1
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: e2e-server-actions-key
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: test
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://server:3001/api/v1
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: e2e-server-actions-key
    ports:
      - "3002:3000"
    restart: unless-stopped
    logging: *default-logging

volumes:
  e2e-postgres-data:
